<f:comment><!--
    ListDispatcher Partial
    Dynamically loads the appropriate List view based on settings.viewType.
    Fallback chain: Document/List/{viewType}.html -> Document/List/List.html -> Error message
    
    Author: Ernedin Zajko <ezajko@root.ba>
--></f:comment>

<f:variable name="viewType" value="{settings.view.viewType -> f:or(alternative: 'List')}" />

<f:render partial="Document/List/{viewType}"
    arguments="{documents: documents, settings: settings, detailPid: detailPid, pagination: pagination, paginator: paginator, filter: filter, availableCategories: availableCategories, availableTypes: availableTypes, availableYears: availableYears}"
    optional="true">
    <f:comment><!-- Fallback to default List view --></f:comment>
    <f:render partial="Document/List/List"
        arguments="{documents: documents, settings: settings, detailPid: detailPid, pagination: pagination, paginator: paginator, filter: filter, availableCategories: availableCategories, availableTypes: availableTypes, availableYears: availableYears}"
        optional="true">
        <div class="alert alert-warning">
            Template partial "Partials/Document/List/{viewType}.html" (or fallback List/List.html) not found.
        </div>
    </f:render>
</f:render>
