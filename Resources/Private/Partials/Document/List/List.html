<f:comment><!--
    Default List View (Table Format)
    This is the fallback template for document lists.
    
    Author: Ernedin Zajko <ezajko@root.ba>
--></f:comment>

<f:comment><!-- Frontend Filter (if enabled in settings) --></f:comment>
<f:if condition="{settings.view.frontEndFilter}">
    <f:render partial="Document/List/Filter" arguments="{
        filter: filter,
        availableCategories: availableCategories,
        availableTypes: availableTypes,
        availableYears: availableYears,
        settings: settings
    }" />
</f:if>

<div class="spark-dms-list spark-dms-list--table">
    <f:if condition="{paginator.paginatedItems}">
        <f:then>
            <table class="table table-striped table-hover mb-4">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Type</th>
                        <th>Date</th>
                        <th>Download</th>
                    </tr>
                </thead>
                <tbody>
                    <f:for each="{paginator.paginatedItems}" as="document">
                        <tr>
                            <td>
                                <f:if condition="{detailPid}">
                                    <f:then>
                                        <f:link.action action="show" pluginName="Pi2" arguments="{document: document}"
                                            pageUid="{detailPid}">
                                            {document.title}
                                        </f:link.action>
                                    </f:then>
                                    <f:else>
                                        <strong>{document.title}</strong>
                                    </f:else>
                                </f:if>
                            </td>
                            <td>
                                <f:if condition="{document.type}">
                                    <span class="badge bg-secondary">{document.type.title}</span>
                                </f:if>
                            </td>
                            <td>
                                <f:format.date format="d.m.Y">{document.documentDate}</f:format.date>
                            </td>
                            <td>
                                <f:if condition="{document.file}">
                                    <f:link.action action="download" arguments="{document: document}"
                                        class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-download"></i> Download
                                    </f:link.action>
                                </f:if>
                            </td>
                        </tr>
                    </f:for>
                </tbody>
            </table>

            <f:render partial="Pagination" arguments="{pagination: pagination, paginator: paginator, filter: filter}" />
        </f:then>
        <f:else>
            <div class="alert alert-info">
                No documents found.
            </div>
        </f:else>
    </f:if>
</div>
