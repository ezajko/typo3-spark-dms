<f:comment><!--
    Default List View for Documents
    Standard table format layout.
    
    Author: Ernedin Zajko <ezajko@root.ba>
--></f:comment>

<f:comment><!-- Frontend Filter (if enabled in settings) --></f:comment>
<f:if condition="{settings.view.frontEndFilter}">
    <f:render partial="Document/List/Filter" arguments="{
        filter: filter,
        availableCategories: availableCategories,
        availableTypes: availableTypes,
        availableYears: availableYears,
        settings: settings
    }" />
</f:if>

<div class="spark-dms-list spark-dms-list--default">
    <f:if condition="{paginator.paginatedItems}">
        <f:then>
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>
                            <f:translate key="list.title" />
                        </th>
                        <th>
                            <f:translate key="list.registry_number" />
                        </th>
                        <th>
                            <f:translate key="list.type" />
                        </th>
                        <th>
                            <f:translate key="list.category" />
                        </th>
                        <th>
                            <f:translate key="list.date" />
                        </th>
                        <th>
                            <f:translate key="general.download" />
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <f:for each="{paginator.paginatedItems}" as="document">
                        <tr>
                            <td>
                                <f:if condition="{detailPid}">
                                    <f:then>
                                        <f:link.action action="show" pluginName="Pi2" arguments="{document: document}"
                                            pageUid="{detailPid}">
                                            {document.title}
                                        </f:link.action>
                                    </f:then>
                                    <f:else>
                                        <strong>{document.title}</strong>
                                    </f:else>
                                </f:if>
                            </td>
                            <td>{document.registryNumber}</td>
                            <td>
                                <f:if condition="{document.type}">
                                    <span class="badge bg-secondary">{document.type.title}</span>
                                </f:if>
                            </td>
                            <td>
                                <f:for each="{document.category}" as="cat" iteration="catIter">
                                    <span class="badge bg-info text-dark">{cat.title}</span>
                                    <f:if condition="{catIter.isLast} == 0"> </f:if>
                                </f:for>
                            </td>
                            <td>
                                <f:format.date format="d.m.Y">{document.documentDate}</f:format.date>
                            </td>
                            <td>
                                <f:if condition="{document.file}">
                                    <f:link.action action="download" arguments="{document: document}"
                                        class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-download"></i>
                                        <f:translate key="general.download" />
                                    </f:link.action>
                                </f:if>
                            </td>
                        </tr>
                    </f:for>
                </tbody>
            </table>

            <f:render partial="Pagination" arguments="{pagination: pagination, paginator: paginator, filter: filter}" />
        </f:then>
        <f:else>
            <div class="alert alert-info">
                <f:translate key="general.no_documents" />
            </div>
        </f:else>
    </f:if>
</div>
