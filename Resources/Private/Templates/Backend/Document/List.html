<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers" data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">
    <h1>Spark DMS: Document Manager</h1>

    <f:flashMessages />

    <div class="table-fit">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>
                        <f:translate key="tx_sparkdms_domain_model_document.title" default="Title" />
                    </th>
                    <th>
                        <f:translate key="tx_sparkdms_domain_model_document.type" default="Type" />
                    </th>
                    <th>
                        <f:translate key="tx_sparkdms_domain_model_document.document_date" default="Date" />
                    </th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <f:for each="{documents}" as="document">
                    <tr>
                        <td>
                            <b>{document.title}</b><br>
                            <small class="text-muted">{document.uuid}</small>
                        </td>
                        <td>
                            <f:if condition="{document.type}">
                                <span class="badge badge-info">{document.type.title}</span>
                            </f:if>
                        </td>
                        <td>
                            <f:format.date format="d.m.Y">{document.documentDate}</f:format.date>
                        </td>
                        <td>
                            <be:link.editRecord table="tx_sparkdms_domain_model_document" uid="{document.uid}"
                                class="btn btn-default btn-sm">
                                <core:icon identifier="actions-open" size="small" /> Edit
                            </be:link.editRecord>
                        </td>
                    </tr>
                </f:for>
            </tbody>
        </table>
    </div>
</f:section>

</html>
